name: ext
description: "An external system dependency with API details, rate limits, and error handling"
version: 1
fields:
  id:
    type: string
    required: true
    pattern: "^odk:ext:.+"
    description: "Unique component identifier in odk:ext:namespace/name format"
  description:
    type: text
    required: true
    description: "What this external dependency provides"
  base_url:
    type: string
    required: true
    description: "Base URL for API calls"
  auth:
    type: string
    required: true
    description: "Authentication method (none, api_key, oauth2, bearer)"
  endpoints:
    type: map
    required: true
    description: "API endpoints we use, keyed by logical name"
    items:
      method:
        type: enum
        values: [GET, POST, PUT, PATCH, DELETE]
        required: true
        description: "HTTP method"
      path:
        type: string
        required: true
        description: "URL path relative to base_url"
      params:
        type: map
        description: "Request parameters"
      response:
        type: any
        required: true
        description: "Response shape"
      description:
        type: string
        required: true
        description: "What this endpoint returns"
  rate_limits:
    type: map
    required: true
    description: "Rate limiting details with our projected usage"
  error_handling:
    type: map
    required: true
    description: "How to handle each error status code"
  retry_strategy:
    type: map
    required: true
    description: "Retry configuration (max_retries, backoff, timeout)"
