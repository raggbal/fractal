name: contract
description: "An interface or protocol contract that defines method signatures for a service"
version: 1
fields:
  id:
    type: string
    required: true
    pattern: "^odk:contract:.+"
    description: "Unique component identifier in odk:contract:namespace/Name format"
  description:
    type: text
    required: true
    description: "What this service contract represents"
  methods:
    type: map
    required: true
    description: "Service methods keyed by method name"
    items:
      description:
        type: string
        required: true
        description: "What this method does"
      params:
        type: map
        required: true
        description: "Method parameters keyed by param name"
      returns:
        type: map
        required: true
        description: "Return type with type and description"
      raises:
        type: ref_list
        description: "Error components this method can raise"
