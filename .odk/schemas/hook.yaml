name: hook
description: "A lifecycle hook or middleware that intercepts requests/events"
version: 1
fields:
  id:
    type: string
    required: true
    pattern: "^odk:hook:.+"
    description: "Unique component identifier in odk:hook:namespace/name format"
  description:
    type: text
    required: true
    description: "What this hook does"
  type:
    type: enum
    values: [middleware, pre-handler, post-handler, event-listener, scheduled]
    required: true
    description: "When this hook fires in the request/event lifecycle"
  trigger:
    type: enum
    values: [request, response, event, schedule]
    required: true
    description: "What triggers this hook"
  position:
    type: enum
    values: [before, after, around]
    required: true
    description: "Where in the pipeline this hook runs"
  applies_to:
    type: map
    required: true
    description: "URL patterns or event types this hook matches"
    items:
      pattern:
        type: string
        required: true
        description: "URL pattern or event type"
      exclude:
        type: list
        description: "Paths or events explicitly excluded"
  behavior:
    type: map
    required: true
    description: "What happens on success and each failure mode"
  configuration:
    type: map
    description: "Configurable parameters for this hook"
