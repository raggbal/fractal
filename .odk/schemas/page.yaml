name: page
description: "A frontend page or view with layout, data sources, and wireframe"
version: 1
fields:
  id:
    type: string
    required: true
    pattern: "^odk:page:.+"
    description: "Unique component identifier in odk:page:namespace/name format"
  description:
    type: text
    required: true
    description: "What this page shows and its primary purpose"
  route:
    type: string
    required: true
    description: "Frontend route path, e.g. /dashboard"
  auth:
    type: enum
    values: [required, optional, none]
    required: true
    description: "Whether this page requires authentication"
  layout:
    type: string
    required: true
    description: "Layout template to use (e.g. main, auth, landing)"
  sections:
    type: list
    required: true
    description: "Sections on this page"
    items:
      name:
        type: string
        required: true
        description: "Section identifier"
      description:
        type: string
        required: true
        description: "What this section displays"
      data_sources:
        type: ref_list
        description: "API routes this section calls for data"
      component:
        type: ref
        ref_type: component
        description: "UI component that renders this section"
  wireframe:
    type: text
    description: "ASCII wireframe of the page layout"
