name: test
description: "A test specification with cases, stubs, and constraints"
version: 1
fields:
  id:
    type: string
    required: true
    pattern: "^odk:test:.+"
    description: "Unique component identifier in odk:test:namespace/name.level format"
  description:
    type: text
    required: true
    description: "What this test spec covers"
  level:
    type: enum
    values: [unit, integration, e2e]
    required: true
    description: "Testing level (unit=isolated, integration=with DB, e2e=full stack)"
  target:
    type: ref
    required: true
    description: "The component being tested"
  cases:
    type: list
    required: true
    description: "Individual test cases"
    items:
      name:
        type: string
        required: true
        description: "Short test name"
      description:
        type: string
        required: true
        description: "What this test validates"
      given:
        type: string
        required: true
        description: "Preconditions"
      when:
        type: string
        required: true
        description: "Action being tested"
      then:
        type: string
        required: true
        description: "Expected outcome"
  stubs:
    type: list
    description: "What is stubbed/faked in this test"
  never_mock:
    type: list
    description: "What must NOT be mocked (real implementations required)"
