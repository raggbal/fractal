name: config
description: "Application configuration — title, version, settings, middleware, CORS"
version: 1
fields:
  id:
    type: string
    required: true
    pattern: "^odk:config:.+"
    description: "Unique component identifier"
  title:
    type: string
    required: true
    description: "Application title (used in OpenAPI docs)"
  version:
    type: string
    required: false
    description: "Application version string"
  database:
    type: map
    required: false
    description: "Database connection settings (url_env, pool_size, etc.)"
  auth:
    type: map
    required: false
    description: "Authentication settings (provider, config)"
  cors:
    type: map
    required: false
    description: "CORS configuration (origins, methods, headers)"
  middleware:
    type: list
    required: false
    description: "Additional middleware to register"
