name: event
description: "A domain event emitted when something significant happens in the system"
version: 1
fields:
  id:
    type: string
    required: true
    pattern: "^odk:event:.+"
    description: "Unique component identifier in odk:event:namespace/name format"
  description:
    type: text
    required: true
    description: "When this event is emitted and what it signifies"
  payload:
    type: map
    required: true
    description: "Event payload fields with types and descriptions"
  producers:
    type: ref_list
    required: true
    description: "Components that emit this event"
  consumers:
    type: list
    required: true
    description: "What reacts to this event (component refs or prose descriptions)"
  ordering:
    type: string
    required: true
    description: "Ordering guarantees (per-user, global, none)"
  idempotency:
    type: string
    required: true
    description: "Deduplication strategy (which field is the idempotency key)"
