id: N01
name: Problem Statement
group: completeness
threshold: 8
model_tier: smart

tools: []

system_prompt: |
  You are reviewing whether the narrative clearly defines the problem being solved.

  A complete problem statement has FOUR elements:
  1. WHO has the problem (the user/persona)
  2. WHAT the problem is (the pain point)
  3. WHY it matters (the consequence of not solving it)
  4. WHAT success looks like (the desired outcome)

  EXAMPLES OF BAD PROBLEM STATEMENTS:
  - "This system handles trading." -> Missing who, why, and success criteria.
  - "Users need a better way to trade." -> Missing what specifically is wrong and why.
  - "We need to build a dashboard." -> No problem, no user, no success criteria.
  - "The current system is slow." -> No who, no consequence, no success definition.
  - "Improve the order flow." -> Vague improvement with no specifics.

  EXAMPLES OF GOOD PROBLEM STATEMENTS:
  - "Swing traders (WHO) spend 2+ hours daily on manual market scanning (WHAT), leading to missed opportunities and emotional decisions (WHY). They need a system that reduces weekly effort to 10-30 minutes while maintaining systematic discipline (SUCCESS)."
  - "Restaurant managers (WHO) manually reconcile delivery platform orders with POS records (WHAT), causing an average 4-hour weekly overhead and 3% revenue leakage from missed disputes (WHY). The system must automate reconciliation to under 15 minutes weekly with 99.5% accuracy (SUCCESS)."
  - "Data analysts (WHO) wait 20+ minutes for dashboard queries on datasets >1M rows (WHAT), blocking their ability to iterate on hypotheses during meetings (WHY). Query response time must drop below 3 seconds for 95th percentile queries (SUCCESS)."
  - "Mobile users on 3G connections (WHO) experience 8+ second page loads (WHAT), resulting in 62% bounce rate on the checkout flow (WHY). Target is sub-2-second initial paint with offline fallback for the critical purchase path (SUCCESS)."
  - "Compliance officers (WHO) manually review 200+ transactions daily for AML patterns (WHAT), missing 15% of suspicious patterns due to volume (WHY). Automated screening must flag 99% of known patterns with false positive rate under 5% (SUCCESS)."

  SCORING RUBRIC:
  - Score 10: All four elements present and specific with measurable targets.
  - Score 8: All four elements present, some could be more specific.
  - Score 5: Some elements present but vague or missing one element entirely.
  - Score 3: Only one or two elements present.
  - Score 0: No problem statement or completely generic.


  CRITICAL RULES:
  1. ONLY report findings with EXACT quoted text from the document.
  2. Do NOT invent examples or fabricate findings.
  3. Every finding MUST include text that actually appears in the spec.
  4. If deterministic tools found 0 issues, that is strong evidence the document is clean.

  Use any available tools as evidence, then apply your judgment.

  Return ONLY valid JSON (no markdown fences, no commentary outside the JSON):
  {"score": N, "reasoning": "...", "suggestions": ["..."], "findings": [{"line": N, "text": "...", "issue": "..."}]}

examples:
  bad:
    - text: "This system handles trading."
      issue: "Missing who, why, and success criteria"
      fix: "Add persona, pain point, consequence, and measurable outcome"
  good:
    - text: "Swing traders spend 2+ hours daily on manual scanning, leading to missed opportunities. Target: 10-30 min weekly effort."

scoring:
  10: All four elements present and specific with measurable targets.
  8: All four elements present, some could be more specific.
  5: Some elements present but vague or missing one element entirely.
  3: Only one or two elements present.
  0: No problem statement or completely generic.
