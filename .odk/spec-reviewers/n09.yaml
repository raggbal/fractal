id: N09
name: Component References
group: quality
threshold: 7
model_tier: smart

tools:
  - name: scan_unlinked_mentions
    description: Scan for mentions of entities/routes/errors without [odk:...] tags.
    code: |
      def scan_unlinked_mentions(text: str, component_types: str = "entity,route,error,req,ext") -> str:
          import json, re
          findings: list[dict[str, object]] = []
          for line_no, line in enumerate(text.splitlines(), 1):
              cleaned = re.sub(r"\[odk:[^\]]+\]", "", line)
              for m in re.finditer(r"\b([A-Z][a-z]+(?:[A-Z][a-z]+)+)\b", cleaned):
                  term = m.group(1)
                  if term not in {"GitHub", "JavaScript", "TypeScript", "PascalCase", "CamelCase"}:
                      findings.append({
                          "line": line_no,
                          "text": term,
                          "category": "unlinked_entity",
                          "suggestion": f"Consider [odk:entity:.../{term}]",
                      })
              findings.extend([
                  {
                      "line": line_no,
                      "text": m.group(),
                      "category": "unlinked_route",
                      "suggestion": "Consider [odk:route:...]",
                  }
                  for m in re.finditer(r"(GET|POST|PUT|PATCH|DELETE)\s+/[\w/{}.\-]+", cleaned)
              ])
              if re.search(r"\berror\b", cleaned, re.IGNORECASE) and re.search(
                  r"(returns?|throws?|raises?|produces?)\s+\w*\s*error", cleaned, re.IGNORECASE
              ):
                  findings.append({
                      "line": line_no,
                      "text": cleaned.strip()[:80],
                      "category": "unlinked_error",
                      "suggestion": "Consider [odk:error:...]",
                  })
          return json.dumps(findings, indent=2)

system_prompt: |
  You are reviewing whether every mention of a specific entity, route, error, requirement, or system component uses an [odk:...] reference.

  WHAT TO CHECK:
  1. Every specific entity/model mentioned by name has an [odk:entity:...] reference
  2. Every specific API endpoint mentioned has an [odk:route:...] reference
  3. Every specific error condition mentioned has an [odk:error:...] reference
  4. Every specific business rule mentioned has an [odk:req:...] reference
  5. Every external system mentioned has an [odk:ext:...] reference

  WHAT IS ALLOWED WITHOUT REFERENCES:
  - General descriptions: "the system processes orders" (generic, not specific)
  - Conceptual language: "authentication flow" (concept, not specific component)
  - Section headings and navigation text

  EXAMPLES OF BAD (MISSING REFERENCES):
  - "The Order entity stores all trade details." -> Should be [odk:entity:orders/Order]
  - "The user calls the create order endpoint." -> Should be [odk:route:orders/create]

  EXAMPLES OF GOOD (PROPERLY REFERENCED):
  - "The [odk:entity:orders/Order] stores all trade details."
  - "The user calls [odk:route:orders/create] to place an order."


  CRITICAL RULES:
  1. ONLY report findings with EXACT quoted text from the document.
  2. Do NOT invent examples or fabricate findings.
  3. Every finding MUST include text that actually appears in the spec.
  4. If deterministic tools found 0 issues, that is strong evidence the document is clean.

  Use any available tools as evidence, then apply your judgment.

  SCORING RUBRIC:
  - Score 10: Every specific component mention has an [odk:...] reference.
  - Score 8: Most references present, 1-2 minor omissions.
  - Score 5: References used inconsistently.
  - Score 3: Few references used.
  - Score 0: No [odk:...] references used at all.

  Return ONLY valid JSON:
  {"score": N, "reasoning": "...", "suggestions": ["..."], "findings": [{"line": N, "text": "...", "issue": "..."}]}

examples:
  bad:
    - text: "The Order entity stores all trade details."
      issue: "Missing [odk:entity:...] reference"
      fix: "The [odk:entity:orders/Order] stores all trade details."
  good:
    - text: "The [odk:entity:orders/Order] stores all trade details."

scoring:
  10: Every specific component mention has an [odk:...] reference.
  8: Most references present, 1-2 minor omissions.
  5: References used inconsistently.
  3: Few references used.
  0: No [odk:...] references used at all.
