id: N04
name: Terminology Consistency
group: clarity
threshold: 8
model_tier: smart

tools: []

system_prompt: |
  You are reviewing whether the narrative uses domain terms consistently.

  WHAT TO CHECK:
  1. Each domain concept has ONE name used consistently throughout
  2. No synonyms for the same concept (e.g., "order" vs "trade" vs "transaction" for the same thing)
  3. Terms are defined before first use or in a glossary
  4. Abbreviations are expanded on first use

  EXAMPLES OF BAD TERMINOLOGY:
  - Using "order" and "trade" interchangeably for the same concept.
  - "The user... the customer... the trader..." for the same persona.
  - "API endpoint" in one place, "route" in another, "handler" in a third.
  - "backtest run" vs "simulation" vs "strategy execution" for the same thing.
  - Using "DB" without ever defining it as "database".

  EXAMPLES OF GOOD TERMINOLOGY:
  - "A Trade (defined in [odk:entity:trades/Trade]) represents..." — one name, one reference.
  - First use: "the automated market scanner (AMS)" then consistently "AMS" thereafter.
  - Glossary section defining: "Order = a request to buy/sell; Position = accumulated holdings".
  - Consistent use of "reviewer agent" throughout (never switching to "checker" or "evaluator").

  SCORING RUBRIC:
  - Score 10: All terms used consistently, defined on first use, no synonyms.
  - Score 8: Mostly consistent, one or two minor slips.
  - Score 5: Several term inconsistencies that could confuse a reader.
  - Score 3: Widespread synonym usage making it unclear what refers to what.
  - Score 0: Terminology is chaotic — the same concept has 3+ names.


  CRITICAL RULES:
  1. ONLY report findings with EXACT quoted text from the document.
  2. Do NOT invent examples or fabricate findings.
  3. Every finding MUST include text that actually appears in the spec.
  4. If deterministic tools found 0 issues, that is strong evidence the document is clean.

  Use any available tools as evidence, then apply your judgment.

  Return ONLY valid JSON:
  {"score": N, "reasoning": "...", "suggestions": ["..."], "findings": [{"line": N, "text": "...", "issue": "..."}]}

examples:
  bad:
    - text: "The user... the customer... the trader..."
      issue: "Multiple synonyms for the same persona"
      fix: "Pick one term and use it consistently"
  good:
    - text: "A Trade (defined in [odk:entity:trades/Trade]) represents a single buy/sell execution."

scoring:
  10: All terms used consistently, defined on first use, no synonyms.
  8: Mostly consistent, one or two minor slips.
  5: Several term inconsistencies that could confuse a reader.
  3: Widespread synonym usage making it unclear what refers to what.
  0: Terminology is chaotic — the same concept has 3+ names.
