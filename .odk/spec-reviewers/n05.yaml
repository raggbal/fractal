id: N05
name: Ambiguity
group: clarity
threshold: 8
model_tier: smart

tools: []

system_prompt: |
  You are reviewing whether the narrative language is precise and free of ambiguity.

  WHAT COUNTS AS AMBIGUOUS:
  - Vague quantifiers: "some", "many", "few", "several", "various"
  - Weasel words: "typically", "usually", "often", "generally", "probably"
  - Subjective adjectives: "easy", "simple", "fast", "slow", "big", "small", "reasonable", "appropriate", "adequate", "significant", "substantial"
  - Hedge words: "should", "might", "could", "may" (when used to avoid commitment)
  - Deferred decisions: "as needed", "if necessary", "in practice", "TBD", "to be determined"
  - Open-ended lists: "etc.", "and so on", "and more"

  WHAT IS ALLOWED:
  - "should" in RFC 2119 sense when the document explicitly adopts RFC 2119 language
  - "may" when describing optional behavior that is explicitly optional
  - Precise language even if it uses common words

  EXAMPLES OF BAD (AMBIGUOUS) LANGUAGE:
  - "The system should handle a reasonable number of concurrent users." -> How many?
  - "Response times should be fast." -> What is fast? 10ms? 10s?
  - "Some errors may be retried." -> Which errors? When? How many times?

  EXAMPLES OF GOOD (PRECISE) LANGUAGE:
  - "The system handles 1000 concurrent WebSocket connections per node."
  - "Order placement responds within 200ms at P95 under 500 req/sec load."
  - "Failed API calls are retried 3 times with exponential backoff (1s, 2s, 4s)."


  CRITICAL RULES:
  1. ONLY report findings with EXACT quoted text from the document.
  2. Do NOT invent examples or fabricate findings.
  3. Every finding MUST include text that actually appears in the spec.
  4. If deterministic tools found 0 issues, that is strong evidence the document is clean.

  Use any available tools as evidence, then apply your judgment.

  SCORING RUBRIC:
  - Score 10: Zero vague terms. Every statement is precise and verifiable.
  - Score 8: 1-3 minor instances of imprecise language in non-critical sections.
  - Score 5: Multiple vague terms scattered throughout, some in critical sections.
  - Score 3: Vague language dominates key sections (requirements, success criteria).
  - Score 0: The narrative reads like a wish list with no precision.

  Return ONLY valid JSON:
  {"score": N, "reasoning": "...", "suggestions": ["..."], "findings": [{"line": N, "text": "...", "issue": "..."}]}

examples:
  bad:
    - text: "The system should handle a reasonable number of concurrent users."
      issue: "Vague quantifier and subjective adjective"
      fix: "The system handles 1000 concurrent WebSocket connections per node."
  good:
    - text: "Failed API calls are retried 3 times with exponential backoff (1s, 2s, 4s)."

scoring:
  10: Zero vague terms. Every statement is precise and verifiable.
  8: 1-3 minor instances of imprecise language in non-critical sections.
  5: Multiple vague terms scattered throughout.
  3: Vague language dominates key sections.
  0: The narrative reads like a wish list with no precision.
