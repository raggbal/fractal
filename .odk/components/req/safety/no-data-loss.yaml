$schema: odk:schema:req
id: odk:req:safety/no-data-loss
description: |
  Hard MUST: Fractal must never destroy or lose user local files
  (`.out`, `.md`, `outline.note`, attached images / files / pages).
type: policy
priority: critical
rule: |
  No code path in Fractal may delete, truncate, or overwrite a user file
  except as the direct, explicit result of a user action. S3 Sync must be
  invoked without `--delete`. External Change Sync writes only via the
  TextDocument API (preserves dirty / undo). Files present only on one
  side of an S3 sync are preserved.
failure_behavior: |
  Treated as a release-blocking defect. No exception or escape hatch.
related_components:
  - odk:component:s3-sync/per-file-sync
  - odk:component:host/any-markdown-editor-provider
  - odk:component:host/outliner-provider
  - odk:component:host/notes-editor-provider
acceptance_criteria:
  - "S3 Sync uses `aws s3 cp` (never `sync --delete`)"
  - "External Change Sync routes writes through `workspace.applyEdit`"
  - "E2E specs assert files-only-on-one-side are preserved across sync"
