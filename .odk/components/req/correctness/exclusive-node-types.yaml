$schema: odk:schema:req
id: odk:req:correctness/exclusive-node-types
description: |
  An Outliner Node must be exactly one of: Page (`isPage=true` with
  `pageId`), File (with `filePath`), Image (with non-empty `images[]`),
  or Plain (none of the above). The fields are mutually exclusive.
type: constraint
priority: high
rule: |
  At most one of `isPage`, `filePath`, `images[]` is populated on any
  Node. Plain nodes have all three empty / false / null. The
  classification determines the Cmd+Enter action and the cell renderer.
failure_behavior: |
  Mode classifier falls back to Plain (no-op). E2E specs assert the
  invariant during JSON serialization.
related_components:
  - odk:entity:outliner/Node
  - odk:component:webview/outliner
  - odk:component:host/outliner-provider
acceptance_criteria:
  - "JSON write path normalizes Node so only one of the three is set"
  - "Outliner-model unit specs cover all four type predicates"
