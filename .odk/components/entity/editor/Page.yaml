$schema: odk:schema:entity
id: odk:entity:editor/Page
description: |
  A Markdown file attached to an Outliner Node via the `@page` command.
  Stored at `<pageDir>/<pageId>.md`. The Markdown text is the source of
  truth for the editor; the WYSIWYG DOM is regenerated from it on render.
fields:
  pageId:
    type: string
    required: true
    primary_key: true
    description: "UUID v4 generated via crypto.randomUUID()"
  filePath:
    type: string
    required: true
    description: "Absolute path to the `.md` file on disk"
  markdown:
    type: string
    required: true
    description: "Plain Markdown body, the source of truth"
  outFileId:
    type: string
    fk: odk:entity:outliner/OutFile
    description: "The OutFile this Page belongs to"
  ownerNodeId:
    type: string
    fk: odk:entity:outliner/Node
    description: "The Node that owns this Page (isPage=true)"
relationships:
  - entity: odk:entity:outliner/Node
    type: one-to-one
    fk: ownerNodeId
    description: "Owned by a single isPage Node"
crud: [create, read, update, delete]
