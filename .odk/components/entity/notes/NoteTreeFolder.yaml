$schema: odk:schema:entity
id: odk:entity:notes/NoteTreeFolder
description: |
  A folder within an `outline.note` tree. Owns ordered children (other
  files or folders) and remembers its collapsed state and color.
fields:
  type:
    type: string
    required: true
    default: "folder"
    description: "Discriminator. Always 'folder' for this entity."
  id:
    type: string
    required: true
    primary_key: true
    description: "Folder ID. Format: 'f' + Date.now().toString(36) + random(4)."
  title:
    type: string
    required: true
    description: "Display title shown in the Notes File Panel"
  childIds:
    type: list
    required: true
    default: []
    description: "Ordered list of child item IDs (files or folders)"
  collapsed:
    type: boolean
    required: true
    default: false
    description: "Whether the folder is collapsed in the UI"
  color:
    type: string
    required: false
    description: "Tailwind palette color name (added in v11+)"
crud: [create, read, update, delete]
