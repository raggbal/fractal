$schema: odk:schema:entity
id: odk:entity:notes/OutlineNote
description: |
  The `outline.note` JSON file at the root of a Note folder.
  Holds the Note's tree of `.out` files and sub-folders plus shared layout
  preferences (panel widths, S3 bucket path, favorites).
  `version` is always `1` and there is no version-driven migration.
fields:
  version:
    type: integer
    required: true
    default: 1
    description: "Schema version. Always 1."
  rootIds:
    type: list
    required: true
    description: "Ordered list of NoteTreeFile/NoteTreeFolder IDs at the root"
  items:
    type: map
    required: true
    description: "Map of NoteTreeFile or NoteTreeFolder objects keyed by item ID"
  panelWidth:
    type: integer
    required: false
    description: "File-panel width in pixels"
  sidePanelWidth:
    type: integer
    required: false
    description: "Side panel width in pixels"
  sidePanelOutlineWidth:
    type: integer
    required: false
    description: "Outline (TOC) sidebar width inside the side panel"
  s3BucketPath:
    type: string
    required: false
    description: "S3 bucket path for Note Sync (e.g. s3://bucket/prefix)"
  favorites:
    type: list
    required: false
    default: []
    description: "Favorite outliner IDs (introduced in v0.207.36+)"
relationships:
  - entity: odk:entity:notes/NoteTreeFile
    type: one-to-many
    fk: noteId
    description: "An OutlineNote contains many NoteTreeFile entries"
  - entity: odk:entity:notes/NoteTreeFolder
    type: one-to-many
    fk: noteId
    description: "An OutlineNote contains many NoteTreeFolder entries"
crud: [create, read, update]
