$schema: odk:schema:nfr
id: odk:nfr:performance/no-ui-block
description: |
  The user-visible UI must never block while the user is typing. Disk
  writes, conversions, and remote calls are deferred via debouncing and
  `requestIdleCallback`. Idle detection ends a typing session after a quiet
  period.
category: performance
target: 0
unit: dropped_frames
measurement: |
  Subjective during E2E test runs; debounce window and idle thresholds
  are part of the editor's design constants.
test_method: |
  Playwright E2E typing scenarios; manual verification across 4 modes.
applies_to:
  - odk:component:webview/editor
  - odk:component:webview/outliner
