$schema: odk:schema:nfr
id: odk:nfr:reliability/no-data-loss
description: |
  User local files (`.out`, `.md`, `outline.note`, attached images / files /
  pages) must never be destroyed by Fractal. S3 Sync runs without `--delete`
  so files only on one side are preserved.
category: reliability
target: 0
unit: lost_files
measurement: |
  E2E tests assert that sync, paste, drop, and external-change flows do not
  remove existing files.
test_method: |
  Playwright specs covering S3 Sync, External Change Sync, and provider
  save paths; manual confirmation across the 4 modes.
applies_to:
  - odk:component:s3-sync/per-file-sync
  - odk:component:host/any-markdown-editor-provider
  - odk:component:host/outliner-provider
  - odk:component:host/notes-editor-provider
