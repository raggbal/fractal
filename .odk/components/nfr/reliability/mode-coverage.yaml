$schema: odk:schema:nfr
id: odk:nfr:reliability/mode-coverage
description: |
  Any feature addition or fix must function correctly across all four
  modes: Outliner Single, Outliner Note, Markdown Single, Markdown Side
  Panel. Missing modes are not acceptable.
category: reliability
target: 4
unit: modes
measurement: |
  Manual verification matrix across the 4 modes; E2E specs cover at least
  the primary mode for each feature.
test_method: |
  Manual confirmation walkthrough; per-mode Playwright fixtures where
  feasible.
applies_to:
  - odk:component:host/any-markdown-editor-provider
  - odk:component:host/outliner-provider
  - odk:component:host/notes-editor-provider
