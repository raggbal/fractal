$schema: odk:schema:component
id: odk:component:webview/html-md-converter
description: |
  HTML → Markdown converter shared between Editor and Outliner webviews.
  Built on turndown + turndown-plugin-gfm with custom rules for tables,
  code blocks, math, and Mermaid. Pure (deterministic). Lives under
  `html-md-converter/` as a sub-package. See ADR-003 and docs/specs/html-md-converter.md.
type: display
framework: agnostic
props:
  html:
    type: string
    required: true
    description: "HTML string to convert"
  rules:
    type: "TurndownRule[]"
    required: false
    description: "Optional override for default rule set"
emits:
  - "Pure return value: Markdown string"
