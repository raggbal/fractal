$schema: odk:schema:component
id: odk:component:webview/outliner
description: |
  Tree UI plus pure data model (`outliner-model.js`). Renders every Node
  into the DOM; supports Table View through `outliner-cell.js`. Image
  cells use the shared `outliner-image-overlay` fullscreen primitive with
  a 3-button toolbar (Copy Image / Open in New Tab / Copy Path) — same
  contract as the Markdown editor's image overlay. Owns its own undo /
  redo stack (200 snapshots) and navigation history (50 entries). See
  docs/specs/outliner.md.
type: input
framework: agnostic
props:
  initialTree:
    type: "OutFile"
    required: true
    description: "Initial Outliner JSON document from the host"
  config:
    type: "WebviewOutlinerConfig"
    required: true
    description: "fontSize, toolbarMode, theme tokens, taskMode"
emits:
  # Document sync / save (debounced JSON sent as { type: 'syncData', content })
  - "webview→host postMessage: syncData, save"
  # Page node lifecycle
  - "webview→host postMessage: makePage, removePage, openPage, openPageInSidePanel, setPageDir, createPageAutoForSidePanel"
  # File / image / attachment side-effects
  - "webview→host postMessage: openAttachedFile, copyAttachedFilePath, copyAttachedFilePaths, openInTextEditor, copyFilePath, copyPagePaths"
  - "webview→host postMessage: insertImage, saveImageAndInsert, readAndInsertImage, saveFileAndInsert, readAndInsertFile"
  - "webview→host postMessage: setImageDir, saveOutlinerImage, setOutlinerImageDir, setOutlinerFileDir, getOutlinerImageDir"
  # Cross-document copy / paste
  - "webview→host postMessage: handlePageAssetsCross, copyImagesCross, handleFileAssetCross, saveOutlinerClipboard"
  - "webview→host postMessage: pasteWithAssetCopy, extractDataUrlsInPastedMd"
  # llms.txt subtree exports
  - "webview→host postMessage: copyLlmsTxtMdTree, copyLlmsTxtFileTree, copyLlmsTxtBothTree"
  # Drop / import
  - "webview→host postMessage: importMdFilesDialog, importFilesDialog, dropFilesImport, dropVscodeUrisImport, notifyDropFolderRejected, notifyDropFileTooLarge"
  # Links
  - "webview→host postMessage: insertLink, openLink, openLinkInTab"
  # Image fullscreen overlay toolbar
  - "webview→host postMessage: copyImageToClipboard, openImageInNewTab"
  # Side Panel
  - "webview→host postMessage: saveSidePanelFile, sidePanelClosed, sidePanelOpenLink, sidePanelNavigateBack, sidePanelNavigateForward, sidePanelOpenInTextEditor, getSidePanelImageDir"
  # AI handoff
  - "webview→host postMessage: sendToChat"
  # Translation
  - "webview→host postMessage: translateContent, translateSelectLang, saveTranslateLangs, saveTranslationToOutlinerNode"
  # Drop / import errors
  - "Drop / import errors: odk:error:import/file-too-large, odk:error:import/directory-rejected"
inbound:
  - "host→webview postMessage: updateData, importMdFilesResult, importFilesResult, updateNodeImages, updateNodeFilePath, insertLinkHtml, insertImageHtml, insertFileLink, sidePanelImageDirStatus, sidePanelFileDirStatus, outlinerImageDirStatus, outlinerImageDirChanged, outlinerFileDirChanged, outlinerImageSaved, pageDirChanged, pageCreated, pasteWithAssetCopyResult, extractDataUrlsInPastedMdResult, sidePanelAssetContext, sidePanelMessage, translateLangSelected, translateResult, translateError, translateSaveOk, translateSaveError, scopeIn, scopeOut, toggleSidebar"
