$schema: odk:schema:component
id: odk:component:s3-sync/per-file-sync
description: |
  Shared mtime newer-wins bidirectional sync engine used by both Note-
  level and Outliner-level sync. Lists local and remote files, compares
  mtimes per file, and emits transfer commands without `--delete`. See
  ADR-002 and docs/specs/s3-sync.md.
type: layout
framework: agnostic
props:
  localRoot:
    type: string
    required: true
    description: "Absolute local directory to sync"
  s3Prefix:
    type: string
    required: true
    description: "S3 destination (s3://bucket/prefix)"
  conflictMode:
    type: "'auto' | 'confirm'"
    required: true
    default: "auto"
    description: "Behavior when both sides have changed"
emits:
  - "Per-file decision: upload | download | skip"
  - "Conflict event when conflictMode='confirm' and both sides changed"
