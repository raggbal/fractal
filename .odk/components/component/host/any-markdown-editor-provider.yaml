$schema: odk:schema:component
id: odk:component:host/any-markdown-editor-provider
description: |
  VS Code `CustomTextEditorProvider` for `.md` / `.markdown` files. Owns
  the WYSIWYG Markdown Editor webview lifecycle: build webview HTML,
  handle postMessage events (sync / save / image / file / drawio /
  translate / paste), apply TextDocument edits, and forward External
  Change Sync diffs to the webview. See docs/specs/any-markdown-editor-provider.md.
type: layout
framework: agnostic
props:
  document:
    type: "vscode.TextDocument"
    required: true
    description: "The .md / .markdown TextDocument under edit"
  webviewPanel:
    type: "vscode.WebviewPanel"
    required: true
    description: "The webview panel hosting the WYSIWYG editor"
  config:
    type: "FractalConfig"
    required: true
    description: "fractal.* settings (image / file dirs, fontSize, etc.)"
emits:
  # Initial / external sync (host pushes the current document into the webview)
  - "host→webview postMessage: update"
  # Image / file / drawio dir status + change notifications
  - "host→webview postMessage: imageDirStatus, sidePanelImageDirStatus, fileDirStatus, sidePanelFileDirStatus, drawioFileChanged"
  # Insert results (host wrote a file and tells the webview to insert HTML)
  - "host→webview postMessage: insertImageHtml, insertFileLink, insertLinkHtml"
  # Editor command bridge
  - "host→webview postMessage: performUndo, performRedo, toggleSourceMode, triggerTranslate, toggleSidebar"
  # Outline / word count results
  - "host→webview postMessage: outline, wordCount"
  # Notes-mode page management results
  - "host→webview postMessage: fileSearchResults, pageCreatedAtPath"
  # Side Panel relay (wraps inner messages from the side panel webview)
  - "host→webview postMessage: sidePanelAssetContext, sidePanelMessage"
  # Paste asset extraction results
  - "host→webview postMessage: pasteWithAssetCopyResult, extractDataUrlsInPastedMdResult"
  # Translate results / errors
  - "host→webview postMessage: translateLangSelected, translateResult, translateError"
  # Anchor scroll
  - "host→webview postMessage: scrollToAnchor"
  # Document mutations
  - "TextDocument WorkspaceEdit (debounced — applied through workspace.applyEdit so dirty state and undo are preserved)"
  # File-system writes
  - "image / file / drawio.svg writes to disk under fractal.imageDir / fractal.fileDir / drawio.svg directory"
