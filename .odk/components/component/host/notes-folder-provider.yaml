$schema: odk:schema:component
id: odk:component:host/notes-folder-provider
description: |
  VS Code `TreeDataProvider` for the Activity Bar "Notes Folders" view.
  Persists the registered folder list in `globalState`; pure CRUD over
  TreeItem[]. See docs/specs/notes-folder-provider.md.
type: layout
framework: agnostic
props:
  globalState:
    type: "vscode.Memento"
    required: true
    description: "Extension globalState key/value store for the folder list"
emits:
  - "TreeView refresh events on add / remove / rename"
  - "Command dispatch to open the Notes WebviewPanel"
