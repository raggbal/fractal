$schema: odk:schema:component
id: odk:component:host/drawio-watcher-registry
description: |
  Registry of `fs.watch` watchers for `.drawio.svg` / `.drawio.png` files
  referenced inside the host content. When drawio Desktop saves a file,
  the registry notifies the owning provider, which then asks the webview
  to refresh the affected image. See docs/specs/drawio-watcher-registry.md.
type: layout
framework: agnostic
props:
  onChange:
    type: "(path: string) => void"
    required: true
    description: "Callback fired when a watched drawio file changes"
emits:
  - "onChange(path) per filesystem write"
