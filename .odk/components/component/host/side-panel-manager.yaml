$schema: odk:schema:component
id: odk:component:host/side-panel-manager
description: |
  Shared side-panel logic used by all three providers: file watch on the
  side-panel host file, debounced save, in-flight back / forward
  navigation stacks (unbounded; one chain per editor instance), and
  forward / back commands. See docs/specs/side-panel-manager.md.
type: layout
framework: agnostic
props:
  host:
    type: "SidePanelHost"
    required: true
    description: "Provider implementing the SidePanelHost interface"
  config:
    type: "FractalConfig"
    required: true
    description: "fractal.* settings"
emits:
  - "Webview postMessage: sidePanelMessage (wraps scrollToAnchor and other inner messages)"
  - "Webview postMessage: sidePanelNavStateUpdate (canGoBack / canGoForward flags)"
  - "File save via TextDocument applyEdit (debounced)"
  - "File watcher notifications when the side-panel host file changes externally"
