$schema: odk:schema:contract
id: odk:contract:host/image-directory-resolver
description: |
  Three-tier resolver that determines where dropped or pasted images are
  saved. Order: per-file front-matter / Outliner JSON `imageDir` →
  workspace setting `fractal.imageDefaultDir` → built-in default (e.g.
  `images/` next to the host file).
methods:
  resolve:
    description: "Return the absolute directory path for image saves"
    params:
      hostFile:
        type: string
        description: "Absolute path of the .md / .out file under edit"
      perFileHint:
        type: string
        description: "Image directory hint embedded in the file (front-matter / JSON)"
      configValue:
        type: string
        description: "Value of `fractal.imageDefaultDir` for this scope"
    returns:
      type: string
      description: "Absolute directory path; created on first write"
    raises:
      - odk:error:import/path-traversal-detected
