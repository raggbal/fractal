$schema: odk:schema:ext
id: odk:ext:npm/marked
description: |
  npm package `marked`. Used by the webview Markdown editor to render
  Markdown for inline preview. Loaded as part of the webview bundle.
base_url: "https://www.npmjs.com/package/marked"
auth: none
endpoints:
  parse:
    method: POST
    path: "marked.parse(${markdown})"
    response: any
    description: "Convert Markdown source to HTML"
rate_limits:
  notes: "In-process JS library; no rate limit"
error_handling:
  parse_error: "marked is permissive; malformed input is rendered as best-effort HTML"
retry_strategy:
  max_retries: 0
  notes: "Synchronous library; not retryable"
