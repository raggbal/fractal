$schema: odk:schema:ext
id: odk:ext:drawio/desktop
description: |
  drawio Desktop is an external editor for `.drawio.svg` and `.drawio.png`
  files referenced inside Markdown / Outliner content. Fractal does not
  invoke drawio directly; instead [odk:component:host/drawio-watcher-registry]
  watches the on-disk file and triggers webview refresh when drawio Desktop
  saves a new version.
base_url: "file://${workspace}"
auth: none
endpoints:
  watch:
    method: GET
    path: "fs.watch(${drawio_path})"
    response: any
    description: "Local fs watch on the drawio file"
rate_limits:
  notes: "OS-level fs.watch; rate is bounded by user save frequency"
error_handling:
  watcher_failure: "Re-register the watcher on next provider activation"
  missing_file: "Drop the watcher silently; UI shows a broken-image placeholder"
retry_strategy:
  max_retries: 0
  notes: "Watcher is reattached on provider lifecycle, not via retry"
