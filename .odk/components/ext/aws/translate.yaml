$schema: odk:schema:ext
id: odk:ext:aws/translate
description: |
  AWS Translate used by [odk:component:translate/aws-translate] to translate
  Markdown files. Accessed via the AWS CLI (see [odk:ext:aws/cli]). Markdown
  is split into segments with code/math/HTML preserved before translation,
  then chunked under a per-request size budget.
base_url: "https://translate.${region}.amazonaws.com"
auth: "delegated to user's AWS CLI configuration"
endpoints:
  translate_text:
    method: POST
    path: "translate translate-text"
    params:
      Text:
        type: string
        description: "Up to 10,000-byte chunk (per Translate quota)"
      SourceLanguageCode:
        type: string
        description: "Source language code (e.g. ja, en)"
      TargetLanguageCode:
        type: string
        description: "Target language code"
    response: any
    description: "Returns the translated text"
rate_limits:
  per_request_bytes: 10000
  notes: "AWS Translate hard limit per TranslateText request; chunker respects this"
error_handling:
  too_large: "Should never reach the API: chunker pre-splits inputs"
  service_error: "Abort the translation session; show user notification"
  unsupported_language: "Surface API error; abort"
retry_strategy:
  max_retries: 0
  notes: "User-initiated; failures are reported"
