$schema: odk:schema:error
id: odk:error:import/file-too-large
description: |
  A user dropped a file larger than the 50 MB cap on the webview Files
  channel. The drop is rejected before any read or save.
status_code: 413
code: FRACTAL_DROP_FILE_TOO_LARGE
detail_template: "File '${filename}' is ${size_mb} MB, exceeding the 50 MB drop cap."
response_shape:
  code:
    type: string
    description: "FRACTAL_DROP_FILE_TOO_LARGE"
  message:
    type: string
    description: "Human-readable detail"
  filename:
    type: string
    description: "Rejected file name"
  size_mb:
    type: number
    description: "Actual file size in megabytes"
triggers:
  - "Dropped file size > 50 MB on the webview Files channel"
related:
  - odk:nfr:capacity/drop-file-size
  - odk:component:webview/editor
  - odk:component:webview/outliner
