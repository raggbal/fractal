<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Fractal Web Clipper - Options</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: #2b2b2b;
            background: #fff;
            margin: 0;
            padding: 24px;
            max-width: 600px;
        }
        h1 { font-size: 18px; margin: 0 0 16px; }
        h2 { font-size: 14px; margin: 24px 0 8px; color: #444; }
        button {
            padding: 8px 14px;
            font-size: 13px;
            border: 1px solid #ccc;
            background: #f7f7f7;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #ececec; }
        button.primary {
            background: #0969da;
            color: #fff;
            border-color: #0969da;
        }
        button.primary:hover { background: #0860c4; }
        button.danger {
            background: #fff;
            color: #c33;
            border-color: #d0a0a0;
        }
        button.danger:hover { background: #fce8e8; }
        button.small { padding: 4px 8px; font-size: 12px; }
        .row { margin: 8px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .status {
            font-size: 12px;
            padding: 6px 8px;
            background: #f0f0f0;
            border-radius: 3px;
        }
        .status.ok { color: #066; background: #e6f7f2; }
        .status.err { color: #c33; background: #fce8e8; }
        .hint { font-size: 12px; color: #888; margin-top: 6px; }
        .folder-list {
            list-style: none;
            padding: 0;
            margin: 0;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .folder-list li {
            padding: 8px 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .folder-list li:last-child { border-bottom: none; }
        .folder-list .name { flex: 1; font-weight: 500; }
        .folder-list .meta { font-size: 11px; color: #999; }
        .folder-list .perm-warn { color: #c33; font-size: 11px; }
        .empty { padding: 12px; color: #999; text-align: center; font-style: italic; }
        code { font-family: monospace; font-size: 12px; background: #f0f0f0; padding: 1px 4px; border-radius: 2px; }
    </style>
</head>
<body>
    <h1>Fractal Web Clipper — Settings</h1>

    <h2>Notes フォルダ</h2>
    <div class="row">
        <button id="addFolderBtn" class="primary">📁 Add Notes Folder…</button>
        <span id="addStatus" class="status" style="display:none"></span>
    </div>
    <div class="hint">対象 Notes フォルダ (= 複数 <code>.out</code> + <code>outline.note</code> を持つ Fractal の管理ディレクトリ) を **複数**登録できます。許可は永続化され毎回聞かれません。</div>

    <ul id="folderList" class="folder-list">
        <li class="empty">(未登録 — 上の「Add Notes Folder」 で追加)</li>
    </ul>

    <div class="hint" style="margin-top: 24px;">対象 outliner の選択は、ツールバー icon を click した時の popup で毎回行います。直前に選んだ outliner が default 選択されます。</div>

    <script src="lib/idb.js"></script>
    <script src="lib/folder-registry.js"></script>
    <script src="options.js"></script>
</body>
</html>
